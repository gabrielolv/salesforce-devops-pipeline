# File: templates/generate-delta.yml
parameters:
  commit_hash: ''
  to_ref: 'HEAD'   # default works for both push and PR pipelines; override with $(System.PullRequest.SourceCommitId) for PRs

steps:
  - task: Bash@3
    inputs:
      targetType: "inline"
      script: |
        echo "Generating delta..."

        mkdir -p delta
        echo "Using commitHash: ${{ parameters.commit_hash }}"

        echo "Generating delta from ${{ parameters.commit_hash }} to ${{ parameters.to_ref }}"
        sfdx sgd:source:delta -f ${{ parameters.commit_hash }} -t ${{ parameters.to_ref }} -o ./delta

        echo -e " \n"
        echo -e "delta/package/package.xml \n"
        cat ./delta/package/package.xml
        echo -e " \n"
        echo -e "delta/destructiveChanges/package.xml \n"
        cat ./delta/destructiveChanges/package.xml
        echo -e " \n"
        echo -e "delta/destructiveChanges/destructiveChanges.xml \n"
        cat ./delta/destructiveChanges/destructiveChanges.xml
    displayName: "Generate delta"


    