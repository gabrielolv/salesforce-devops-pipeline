# templates/get-last-successful-commit.yml
parameters:
  commitHashParam: ''     # if non-empty, skip API lookup and use this value directly
  definitionId: ''        # definition ID of the pipeline to query (takes precedence over definitionName)
  definitionName: ''      # name of the pipeline to query (e.g. SalesforceARCC-Deploy); resolved to ID via API
  targetBranch: 'main'    # branch to find the last successful run on

steps:
  - task: Bash@3
    displayName: "Get last successful run details"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    inputs:
      targetType: "inline"
      script: |
        commitHash="${{ parameters.commitHashParam }}"

        if [ -n "$commitHash" ]; then
          echo "commitHash already provided: $commitHash. Skipping API lookup."
          echo "##vso[task.setvariable variable=commitHash]$commitHash"
          exit 0
        fi

        targetBranch="${{ parameters.targetBranch }}"

        encodedProject=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$SYSTEM_TEAMPROJECT")
        encodedBranch=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "refs/heads/${targetBranch}")

        echo "SYSTEM_TEAMFOUNDATIONCOLLECTIONURI: $SYSTEM_TEAMFOUNDATIONCOLLECTIONURI"
        echo "SYSTEM_TEAMPROJECT: $SYSTEM_TEAMPROJECT"

        # Resolve definition ID: explicit ID > name lookup > current pipeline
        definitionId="${{ parameters.definitionId }}"
        definitionName="${{ parameters.definitionName }}"

        if [ -z "$definitionId" ] && [ -n "$definitionName" ]; then
          echo "Resolving definition ID for pipeline: $definitionName"
          encodedDefName=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$definitionName")
          defUrl="${SYSTEM_TEAMFOUNDATIONCOLLECTIONURI}${encodedProject}/_apis/build/definitions?name=${encodedDefName}&api-version=6.0"
          defResponse=$(curl -s -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" "$defUrl")
          definitionId=$(echo "$defResponse" | jq -r '.value[0].id // empty')
          if [ -z "$definitionId" ]; then
            echo "##vso[task.logissue type=error]Could not find a pipeline definition named '$definitionName'. Check the name and ensure the token has access."
            exit 1
          fi
          echo "Resolved '$definitionName' to definition ID: $definitionId"
        fi

        [ -z "$definitionId" ] && definitionId="$SYSTEM_DEFINITIONID"

        echo "Querying pipeline definition $definitionId for last successful run on branch: $targetBranch"

        url="${SYSTEM_TEAMFOUNDATIONCOLLECTIONURI}${encodedProject}/_apis/build/builds?definitions=${definitionId}&branchName=${encodedBranch}&resultFilter=succeeded&\$top=1&api-version=6.0"
        echo "URL: $url"

        response=$(curl -s -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" "$url")

        triggeredCommit=$(echo "$response" | jq -r '.value[0].sourceVersion // empty')

        if [ -n "$triggeredCommit" ]; then
          echo "Last successful deployment commit on $targetBranch: $triggeredCommit"
          echo "##vso[task.setvariable variable=commitHash]$triggeredCommit"
        else
          echo "##vso[task.logissue type=error]No successful run found for pipeline $definitionId on branch $targetBranch. Cannot determine a safe base commit."
          echo "Provide a commitHashParam explicitly or ensure at least one successful run exists for this pipeline."
          exit 1
        fi
