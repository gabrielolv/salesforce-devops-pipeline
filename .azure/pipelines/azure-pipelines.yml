trigger:
  - develop
  - qa
  - uat
  - PreProd
  - main

parameters:
  - name: CommitHash
    type: string
    default: ''

stages:
# ─────────────── BUILD & VALIDATION ─────────────── 
- stage: BuildAndValidate
  displayName: "Build and Pre-Deployment Validation"
  jobs:
  - job: BuildAndValidateJob
    displayName: "Build and Validate Job"
    condition: always()
    pool:
      vmImage: 'ubuntu-latest'

    variables:
      - ${{ if eq(variables['Build.SourceBranchName'], 'develop') }}:
          - group: Salesforce_Connector_Dev
      - ${{ if eq(variables['Build.SourceBranchName'], 'qa') }}:
          - group: Salesforce_Connector_QA
      - ${{ if eq(variables['Build.SourceBranchName'], 'uat') }}:
          - group: Salesforce_Connector_UAT
      - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
          - group: Salesforce_Connector_PROD
            
      - name: system.debug
        value: true

      - name: commitHashParam
        value: ${{parameters.CommitHash}}

    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 0
        displayName: "Checkout repository"

      # Install Salesforce CLI
      - template: .azure/templates/install-sf-cli.yml

      # Get the commit hash from parameters or use the latest commit
      - template: .azure/templates/get-commit-hash.yml
        parameters:
          commitHashParam: $(commitHashParam)

      # Get the last successful commit
      - template: .azure/templates/get-last-successful-commit.yml
        parameters:
          commitHashVariable: $(commitHash)

      # Install necessary plugins
      - template: .azure/templates/install-plugin.yml

      # Generate the delta package based on the last successful commit
      - template: .azure/templates/generate-delta.yml
        parameters:
          commit_hash: $(commitHash)   

      # Generate the sf command for running tests
      - task: Bash@3
        inputs:
          targetType: "inline"
          script: |
            echo "Generating sf command for running tests..."
            # Run the Node.js script
            sfCommandTests=$(node -e "require('./pipelines/GenerateSfdxCommand.js')();") 

            # Set the Azure DevOps pipeline variable
            echo "##vso[task.setvariable variable=sfCommandTests]$sfCommandTests"
            echo "sfCommandTests: $sfCommandTests"
        displayName: "Generate sf command for running tests"

      # Salesforce login
      - template: .azure/templates/sf-login.yml
        parameters:
          sf_username: $(SF_USERNAME)
          sf_password: $(SF_PASSWORD)
          sf_client_id: $(SF_CLIENT_ID)
          sf_client_secret: $(SF_CLIENT_SECRET)
          sf_login_url: $(SF_LOGIN_URL)

      # Check if the delta package has any components to deploy
      - task: Bash@3
        name: checkDelta
        displayName: "Check if delta package is empty"
        inputs:
          targetType: "inline"
          script: |
            sfdx_project_dir=$(find . -name 'sfdx-project.json' -exec dirname {} \; | head -n 1)
            [ -n "$sfdx_project_dir" ] && pkg="$sfdx_project_dir/delta/package/package.xml" || pkg="./delta/package/package.xml"
            if [ ! -f "$pkg" ] || ! grep -q "<members>" "$pkg"; then
              echo "Nothing to deploy — delta package has no components."
              echo "##vso[task.setvariable variable=sf_nothing_to_deploy]true"
              echo "##vso[task.setvariable variable=sf_nothing_to_deploy;isOutput=true]true"
            else
              echo "Changes detected in delta package."
              echo "##vso[task.setvariable variable=sf_nothing_to_deploy]false"
              echo "##vso[task.setvariable variable=sf_nothing_to_deploy;isOutput=true]false"
            fi

      # Check deployment to Salesforce including running specific tests
      - template: .azure/templates/sf-check-deploy.yml
        parameters:
          includeSfCommandTests: true
          displayName: "Check to deploy to Salesforce"
          condition: "and(succeeded(), ne(variables['sf_nothing_to_deploy'], 'true'))"

      # Run all tests to validate the deployment
      - template: .azure/templates/sf-check-deploy.yml
        parameters:
          runAllTests: true
          displayName: "Run all tests"
          condition: "and(succeeded(), ne(variables['sf_nothing_to_deploy'], 'true'))"

# ─────────────── SALESFORCE DEPLOYMENT ───────────────
- stage: DeployToSalesforce
  displayName: "Salesforce Deployment"
  dependsOn: BuildAndValidate
  condition: and(succeeded(), in(variables['Build.SourceBranchName'], 'develop', 'qa', 'uat', 'main'))

  variables:
      - name: sf_nothing_to_deploy
        value: $[stageDependencies.BuildAndValidate.BuildAndValidateJob.outputs['checkDelta.sf_nothing_to_deploy']]
      - ${{ if eq(variables['Build.SourceBranchName'], 'develop') }}:
          - group: Salesforce_Connector_Dev
      - ${{ if eq(variables['Build.SourceBranchName'], 'qa') }}:
          - group: Salesforce_Connector_QA
      - ${{ if eq(variables['Build.SourceBranchName'], 'uat') }}:
          - group: Salesforce_Connector_UAT
      - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
          - group: Salesforce_Connector_PROD

  jobs:
    - job: DeployToSalesforceJob
      displayName: "Deploy to Salesforce"
      condition: and(succeeded(), ne(variables['sf_nothing_to_deploy'], 'true'))
      pool:
        vmImage: 'ubuntu-latest'

      steps:
        - checkout: self
          persistCredentials: true
          fetchDepth: 0

        # Install Salesforce CLI
        - template: .azure/templates/install-sf-cli.yml

        # Get the last successful commit
        - template: .azure/templates/get-last-successful-commit.yml
          parameters:
            commitHashVariable: $(commitHash)

        # Install necessary plugins
        - template: .azure/templates/install-plugin.yml

        # Generate the delta package based on the last successful commit
        - template: .azure/templates/generate-delta.yml
          parameters:
            commit_hash: $(commitHash)

        # Salesforce login
        - template: .azure/templates/sf-login.yml
          parameters:
            sf_username: $(SF_USERNAME)
            sf_password: $(SF_PASSWORD)
            sf_client_id: $(SF_CLIENT_ID)
            sf_client_secret: $(SF_CLIENT_SECRET)
            sf_login_url: $(SF_LOGIN_URL)

        # Deployment to Salesforce
        - template: .azure/templates/sf-deploy.yml
