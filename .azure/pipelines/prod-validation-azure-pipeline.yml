trigger: none

pr:
  branches:
    include:
      - main

parameters:
  - name: CommitHash
    type: string
    default: ''
  - name: DeploymentPipelineDefinitionId
    type: string
    default: ''
    # Set this to the definition ID of azure-pipelines.yml so the last successful
    # deployment commit on main is used as the delta base. Leave empty to fall back
    # to the latest commit on main.

stages:
# ─────────────── BUILD & VALIDATION ───────────────
- stage: BuildAndValidate
  displayName: "Build and Pre-Deployment Validation"
  jobs:
  - job: BuildAndValidateJob
    displayName: "Build and Validate Job"
    pool:
      vmImage: 'ubuntu-latest'

    variables:
      - group: Salesforce_Connector_PROD

      - name: system.debug
        value: true

      - name: commitHashParam
        value: ${{parameters.CommitHash}}

    steps:
      - checkout: self
        persistCredentials: true
        fetchDepth: 0
        displayName: "Checkout repository"

      # Install Salesforce CLI
      - template: .azure/templates/install-sf-cli.yml

      # Resolve the base commit: last successfully deployed commit on main.
      # If CommitHash is provided manually it is used directly.
      # DeploymentPipelineDefinitionId must point to the definition ID of
      # azure-pipelines.yml so the API can find the right last-success commit.
      - template: .azure/templates/get-last-successful-commit-prod-validation.yml
        parameters:
          definitionName: 'SalesforceARCC-Deploy'
          targetBranch: main

      # Install necessary plugins
      - template: .azure/templates/install-plugin.yml

      # Generate delta: FROM last successful main commit TO PR source branch tip.
      # System.PullRequest.SourceCommitId is the actual SHA on the PR branch,
      # avoiding the synthetic 'origin/merge' ref that breaks sgd in PR pipelines.
      - template: .azure/templates/generate-delta-prod-validation.yml
        parameters:
          commit_hash: $(commitHash)
          to_ref: $(System.PullRequest.SourceCommitId)

      # Generate the sf command for running tests
      - task: Bash@3
        displayName: "Generate sf command for running tests"
        inputs:
          targetType: "inline"
          script: |
            echo "Generating sf command for running tests..."
            sfCommandTests=$(node -e "require('./pipelines/GenerateSfdxCommand.js')();")
            echo "##vso[task.setvariable variable=sfCommandTests]$sfCommandTests"
            echo "sfCommandTests: $sfCommandTests"

      # Salesforce login
      - template: .azure/templates/sf-login.yml
        parameters:
          sf_username: $(SF_USERNAME)
          sf_password: $(SF_PASSWORD)
          sf_client_id: $(SF_CLIENT_ID)
          sf_client_secret: $(SF_CLIENT_SECRET)
          sf_login_url: $(SF_LOGIN_URL)

      # Check if the delta package has any components to deploy
      - task: Bash@3
        name: checkDelta
        displayName: "Check if delta package is empty"
        inputs:
          targetType: "inline"
          script: |
            sfdx_project_dir=$(find . -name 'sfdx-project.json' -exec dirname {} \; | head -n 1)
            [ -n "$sfdx_project_dir" ] && pkg="$sfdx_project_dir/delta/package/package.xml" || pkg="./delta/package/package.xml"
            if [ ! -f "$pkg" ] || ! grep -q "<members>" "$pkg"; then
              echo "Nothing to deploy — delta package has no components."
              echo "##vso[task.setvariable variable=sf_nothing_to_deploy]true"
              echo "##vso[task.setvariable variable=sf_nothing_to_deploy;isOutput=true]true"
            else
              echo "Changes detected in delta package."
              echo "##vso[task.setvariable variable=sf_nothing_to_deploy]false"
              echo "##vso[task.setvariable variable=sf_nothing_to_deploy;isOutput=true]false"
            fi

      # Validate deployment with specific tests — fails the pipeline if validation fails
      - template: .azure/templates/sf-check-deploy.yml
        parameters:
          includeSfCommandTests: true
          displayName: "Check to deploy to Salesforce"
          condition: "and(succeeded(), ne(variables['sf_nothing_to_deploy'], 'true'))"

      # Run all local tests — informational only, logs a warning on failure
      - template: .azure/templates/sf-check-deploy.yml
        parameters:
          runAllTests: true
          displayName: "Run all tests"
          condition: "and(succeeded(), ne(variables['sf_nothing_to_deploy'], 'true'))"
