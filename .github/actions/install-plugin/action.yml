name: Install SF Plugins
description: Configure SOAP API for deployment and link the repo-vendored sfdx-git-delta

runs:
  using: composite
  steps:
    - name: Use SOAP API for Deployment
      shell: bash
      run: |
        echo "Configuring Salesforce CLI to use SOAP API for deployment..."
        sf config set org-metadata-rest-deploy false --global

    - name: Link vendored sfdx-git-delta Plugin
      shell: bash
      run: |
        echo "Linking repo-vendored sfdx-git-delta plugin (no download from npm)..."
        PLUGIN_DIR="${GITHUB_WORKSPACE}/.github/plugins/sfdx-git-delta"
        if [ ! -d "${PLUGIN_DIR}/node_modules" ]; then
          echo "::error::Vendored plugin missing or has no node_modules at ${PLUGIN_DIR}"
          exit 1
        fi
        sf plugins link "${PLUGIN_DIR}" --no-install
        echo "Installed plugins:"
        sf plugins
